name: ClaudeSwitch
options:
  bundleIdPrefix: dev.claudeswitch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3J5987UXFQ
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ClaudeSwitch:
    type: application
    platform: macOS
    sources:
      - path: ClaudeSwitch
    info:
      path: ClaudeSwitch/Info.plist
      properties:
        CFBundleDisplayName: Claude Switch
        CFBundleName: Claude Switch
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Sascha Heyer"
        ATSApplicationFontsPath: "."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ClaudeSwitch/ClaudeSwitch.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: Claude Switch
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudeswitch.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
